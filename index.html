<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pedreira Boi Preto — Controle de Estoque</title>
<link rel="icon" href="data:,">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// =====================================================================
// CONFIGURAÇÃO — preencha com os dados do seu projeto Supabase
// (Settings > API no painel do Supabase)
// =====================================================================
const SUPABASE_URL = "COLE_AQUI_SUA_SUPABASE_URL";
const SUPABASE_ANON_KEY = "COLE_AQUI_SUA_SUPABASE_ANON_KEY";
// =====================================================================

const CONFIGURED = !SUPABASE_URL.startsWith("COLE_AQUI") && !SUPABASE_ANON_KEY.startsWith("COLE_AQUI");

async function kvGet(key) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
  });
  if (!res.ok) throw new Error("Falha ao carregar dados");
  const data = await res.json();
  return data.length ? JSON.parse(data[0].value) : [];
}
async function kvSet(key, value) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates"
    },
    body: JSON.stringify({ key, value: JSON.stringify(value) })
  });
  if (!res.ok) throw new Error("Falha ao salvar dados");
}

const ITEMS_KEY = "almox:items";
const MOV_KEY = "almox:movements";

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmtNum(n) { return Number(n || 0).toLocaleString("pt-BR"); }
function fmtDate(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}
function stockStatus(item) {
  const q = Number(item.quantidade) || 0;
  const min = Number(item.estoqueMinimo) || 0;
  if (q <= min) return "danger";
  if (q <= min * 1.5) return "amber";
  return "success";
}

// ---------- ícones (SVG simples, sem dependências) ----------
function Ic({ children, size = 16, className = "" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      {children}
    </svg>
  );
}
const IconPackage = (p) => <Ic {...p}><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z" /><path d="M3 8l9 5 9-5" /><path d="M12 13v8" /></Ic>;
const IconBoxes = (p) => <Ic {...p}><path d="M3 7l6-3 6 3v6l-6 3-6-3V7z" /><path d="M15 10l6-3v6l-6 3" /><path d="M9 10v6" /><path d="M3 7l6 3" /><path d="M9 10l6-3" /></Ic>;
const IconDown = (p) => <Ic {...p}><circle cx="12" cy="12" r="9" /><path d="M12 8v8M9 13l3 3 3-3" /></Ic>;
const IconUp = (p) => <Ic {...p}><circle cx="12" cy="12" r="9" /><path d="M12 16V8M9 11l3-3 3 3" /></Ic>;
const IconAlert = (p) => <Ic {...p}><path d="M12 3l10 18H2L12 3z" /><path d="M12 10v4" /><path d="M12 17h.01" /></Ic>;
const IconSearch = (p) => <Ic {...p}><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></Ic>;
const IconPlus = (p) => <Ic {...p}><path d="M12 5v14M5 12h14" /></Ic>;
const IconTrash = (p) => <Ic {...p}><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" /></Ic>;
const IconEdit = (p) => <Ic {...p}><path d="M16 3l5 5-11 11H5v-5L16 3z" /></Ic>;
const IconDownload = (p) => <Ic {...p}><path d="M12 3v12M7 11l5 5 5-5" /><path d="M5 21h14" /></Ic>;
const IconUpload = (p) => <Ic {...p}><path d="M12 21V9M7 13l5-5 5 5" /><path d="M5 21h14" /></Ic>;
const IconDash = (p) => <Ic {...p}><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /></Ic>;
const IconList = (p) => <Ic {...p}><path d="M4 6h.01M4 12h.01M4 18h.01" /><path d="M9 6h11M9 12h11M9 18h11" /></Ic>;
const IconClipboard = (p) => <Ic {...p}><rect x="6" y="4" width="12" height="17" rx="2" /><path d="M9 4V3h6v1" /><path d="M9 10h6M9 14h6" /></Ic>;
const IconX = (p) => <Ic {...p}><path d="M18 6L6 18M6 6l12 12" /></Ic>;
const IconChevron = (p) => <Ic {...p}><path d="M6 9l6 6 6-6" /></Ic>;
const IconLoader = (p) => <Ic {...p}><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8" /></Ic>;

// ---------- componentes auxiliares ----------
function Gauge({ item }) {
  const q = Number(item.quantidade) || 0;
  const min = Number(item.estoqueMinimo) || 0;
  const ceiling = Math.max(q, min * 2, 1);
  const fillPct = Math.min(100, (q / ceiling) * 100);
  const minPct = Math.min(100, (min / ceiling) * 100);
  const status = stockStatus(item);
  return (
    <div className="gauge" title={`Mínimo: ${fmtNum(min)}`}>
      <div className="gauge-track">
        <div className={`gauge-fill gauge-${status}`} style={{ width: fillPct + "%" }} />
        <div className="gauge-min" style={{ left: minPct + "%" }} />
      </div>
    </div>
  );
}
function Badge({ status, children }) { return <span className={`badge badge-${status}`}>{children}</span>; }

function Modal({ title, onClose, children, wide }) {
  return (
    <div className="modal-backdrop" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={"modal" + (wide ? " modal-wide" : "")}>
        <div className="modal-head"><h3>{title}</h3><button className="icon-btn" onClick={onClose}><IconX size={18} /></button></div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

function ItemPicker({ items, value, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    const base = !q ? items : items.filter(i => i.nome.toLowerCase().includes(q) || i.codigo.toLowerCase().includes(q));
    return base.slice(0, 30);
  }, [items, query]);
  const selected = items.find(i => i.id === value);
  return (
    <div className="picker" ref={ref}>
      <button type="button" className="picker-input" onClick={() => setOpen(o => !o)}>
        <span className={selected ? "" : "muted"}>{selected ? `${selected.codigo} — ${selected.nome}` : (placeholder || "Selecione um item")}</span>
        <IconChevron size={16} />
      </button>
      {open && (
        <div className="picker-menu">
          <div className="picker-search"><IconSearch size={14} /><input autoFocus placeholder="Buscar por código ou nome..." value={query} onChange={e => setQuery(e.target.value)} /></div>
          <div className="picker-list">
            {filtered.length === 0 && <div className="picker-empty">Nenhum item encontrado</div>}
            {filtered.map(i => (
              <button type="button" key={i.id} className="picker-item" onClick={() => { onChange(i.id); setOpen(false); setQuery(""); }}>
                <span className="picker-code">{i.codigo}</span><span>{i.nome}</span>
                <span className="picker-qty">{fmtNum(i.quantidade)} {i.unidade}</span>
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- tela de configuração pendente ----------
function ConfigMissing() {
  return (
    <div className="config-screen">
      <div className="config-card">
        <IconAlert size={26} />
        <h2>Configuração pendente</h2>
        <p>Este arquivo ainda não está ligado ao banco de dados. Abra o arquivo <code>index.html</code>,
        procure por <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> no topo do código e cole os valores
        do seu projeto Supabase (Settings → API).</p>
      </div>
    </div>
  );
}

// ---------- App principal ----------
function App() {
  const [items, setItems] = useState([]);
  const [movements, setMovements] = useState([]);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState("");
  const [view, setView] = useState("dashboard");

  useEffect(() => {
    if (!CONFIGURED) { setLoading(false); return; }
    (async () => {
      try {
        const [it, mv] = await Promise.all([kvGet(ITEMS_KEY), kvGet(MOV_KEY)]);
        setItems(it); setMovements(mv);
      } catch (e) {
        setErrorMsg("Não foi possível conectar ao banco de dados. Verifique sua internet e as chaves do Supabase.");
      }
      setLoading(false);
    })();
  }, []);

  async function persistItems(next) {
    setItems(next);
    try { await kvSet(ITEMS_KEY, next); } catch { setErrorMsg("Falha ao salvar. Tente novamente."); }
  }
  async function persistMovements(next) {
    setMovements(next);
    try { await kvSet(MOV_KEY, next); } catch { setErrorMsg("Falha ao salvar. Tente novamente."); }
  }

  if (!CONFIGURED) return <ConfigMissing />;

  const lowStockItems = useMemo(() => items.filter(i => Number(i.quantidade) <= Number(i.estoqueMinimo)), [items]);

  return (
    <div className="almox-app">
      <style>{CSS}</style>
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark"><IconBoxes size={20} /></div>
          <div><div className="brand-title">PEDREIRA BOI PRETO</div><div className="brand-sub">controle de estoque</div></div>
        </div>
        <nav className="nav">
          <button className={"nav-item" + (view === "dashboard" ? " active" : "")} onClick={() => setView("dashboard")}><IconDash size={17} /> Painel</button>
          <button className={"nav-item" + (view === "itens" ? " active" : "")} onClick={() => setView("itens")}><IconPackage size={17} /> Itens {items.length > 0 && <span className="nav-count">{items.length}</span>}</button>
          <button className={"nav-item" + (view === "movimentacoes" ? " active" : "")} onClick={() => setView("movimentacoes")}><IconList size={17} /> Movimentações</button>
          <button className={"nav-item" + (view === "relatorios" ? " active" : "")} onClick={() => setView("relatorios")}><IconClipboard size={17} /> Relatórios</button>
        </nav>
        {lowStockItems.length > 0 && (
          <button className="sidebar-alert" onClick={() => setView("itens")}><IconAlert size={15} /><span>{lowStockItems.length} item(ns) abaixo do mínimo</span></button>
        )}
      </aside>
      <main className="main">
        {errorMsg && <div className="error-banner">{errorMsg}</div>}
        {loading ? (
          <div className="loading-screen"><IconLoader className="spin" size={22} /> Carregando estoque...</div>
        ) : view === "dashboard" ? (
          <Dashboard items={items} movements={movements} lowStockItems={lowStockItems} setView={setView} />
        ) : view === "itens" ? (
          <ItensView items={items} persistItems={persistItems} />
        ) : view === "movimentacoes" ? (
          <MovimentacoesView items={items} movements={movements} persistItems={persistItems} persistMovements={persistMovements} />
        ) : (
          <RelatoriosView items={items} movements={movements} />
        )}
      </main>
    </div>
  );
}

function Dashboard({ items, movements, lowStockItems, setView }) {
  const totalQtd = items.reduce((s, i) => s + (Number(i.quantidade) || 0), 0);
  const now = new Date();
  const movMes = movements.filter(m => { const d = new Date(m.data); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  const entradasMes = movMes.filter(m => m.tipo === "entrada").reduce((s, m) => s + Number(m.quantidade), 0);
  const saidasMes = movMes.filter(m => m.tipo === "saida").reduce((s, m) => s + Number(m.quantidade), 0);
  const recentMov = [...movements].sort((a, b) => new Date(b.data) - new Date(a.data)).slice(0, 6);

  return (
    <div>
      <header className="view-head"><div><h1>Painel do almoxarifado</h1><p className="subtitle">Visão geral do estoque em tempo real</p></div></header>
      <div className="cards-grid">
        <div className="stat-card"><div className="stat-icon icon-steel"><IconPackage size={18} /></div><div><div className="stat-value">{fmtNum(items.length)}</div><div className="stat-label">itens cadastrados</div></div></div>
        <div className="stat-card"><div className="stat-icon icon-steel"><IconBoxes size={18} /></div><div><div className="stat-value">{fmtNum(totalQtd)}</div><div className="stat-label">unidades em estoque</div></div></div>
        <div className="stat-card"><div className="stat-icon icon-success"><IconDown size={18} /></div><div><div className="stat-value">{fmtNum(entradasMes)}</div><div className="stat-label">entradas este mês</div></div></div>
        <div className="stat-card"><div className="stat-icon icon-danger"><IconUp size={18} /></div><div><div className="stat-value">{fmtNum(saidasMes)}</div><div className="stat-label">saídas este mês</div></div></div>
      </div>
      <div className="split-grid">
        <section className="panel">
          <div className="panel-head"><h2><IconAlert size={16} /> Estoque baixo</h2><button className="link-btn" onClick={() => setView("itens")}>ver todos os itens</button></div>
          {lowStockItems.length === 0 ? <div className="empty-mini">Nenhum item abaixo do mínimo. Tudo em ordem.</div> : (
            <div className="mini-list">
              {lowStockItems.slice(0, 8).map(i => (
                <div className="mini-row" key={i.id}>
                  <div className="mini-info"><span className="mini-code">{i.codigo}</span><span>{i.nome}</span></div>
                  <Gauge item={i} /><span className="mini-qty">{fmtNum(i.quantidade)} / {fmtNum(i.estoqueMinimo)}</span>
                </div>
              ))}
            </div>
          )}
        </section>
        <section className="panel">
          <div className="panel-head"><h2><IconList size={16} /> Últimas movimentações</h2></div>
          {recentMov.length === 0 ? <div className="empty-mini">Nenhuma movimentação registrada ainda.</div> : (
            <div className="mini-list">
              {recentMov.map(m => (
                <div className="mini-row" key={m.id}>
                  {m.tipo === "entrada" ? <IconDown size={16} className="txt-success" /> : <IconUp size={16} className="txt-danger" />}
                  <div className="mini-info"><span>{m.itemNome}</span><span className="mini-sub">{fmtDate(m.data)}</span></div>
                  <span className="mini-qty">{m.tipo === "entrada" ? "+" : "-"}{fmtNum(m.quantidade)}</span>
                </div>
              ))}
            </div>
          )}
        </section>
      </div>
    </div>
  );
}

const emptyForm = { codigo: "", nome: "", categoria: "", unidade: "un", quantidade: 0, estoqueMinimo: 0, localizacao: "" };

function ItensView({ items, persistItems }) {
  const [query, setQuery] = useState("");
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState(emptyForm);
  const [editId, setEditId] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [importText, setImportText] = useState("");
  const categorias = useMemo(() => [...new Set(items.map(i => i.categoria).filter(Boolean))], [items]);
  const [catFilter, setCatFilter] = useState("");

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return items.filter(i => {
      const matchesQ = !q || i.nome.toLowerCase().includes(q) || i.codigo.toLowerCase().includes(q) || (i.localizacao || "").toLowerCase().includes(q);
      const matchesCat = !catFilter || i.categoria === catFilter;
      return matchesQ && matchesCat;
    });
  }, [items, query, catFilter]);

  function openAdd() { setForm(emptyForm); setEditId(null); setModal("add"); }
  function openEdit(item) { setForm({ ...item }); setEditId(item.id); setModal("edit"); }
  async function submitForm(e) {
    e.preventDefault();
    if (!form.codigo.trim() || !form.nome.trim()) return;
    if (editId) {
      await persistItems(items.map(i => i.id === editId ? { ...form, id: editId, quantidade: Number(form.quantidade), estoqueMinimo: Number(form.estoqueMinimo) } : i));
    } else {
      const newItem = { ...form, id: uid(), quantidade: Number(form.quantidade) || 0, estoqueMinimo: Number(form.estoqueMinimo) || 0 };
      await persistItems([newItem, ...items]);
    }
    setModal(null);
  }
  async function doDelete(id) { await persistItems(items.filter(i => i.id !== id)); setConfirmDelete(null); }
  async function doImport() {
    const lines = importText.split("\n").map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) return;
    const delim = lines[0].includes(";") ? ";" : ",";
    const newItems = [];
    for (const line of lines) {
      const cols = line.split(delim).map(c => c.trim());
      const [codigo, nome, categoria, unidade, quantidade, estoqueMinimo, localizacao] = cols;
      if (!codigo || !nome || isNaN(parseFloat(quantidade))) continue;
      newItems.push({ id: uid(), codigo, nome, categoria: categoria || "", unidade: unidade || "un", quantidade: parseFloat(quantidade) || 0, estoqueMinimo: parseFloat(estoqueMinimo) || 0, localizacao: localizacao || "" });
    }
    if (newItems.length > 0) await persistItems([...newItems, ...items]);
    setImportText(""); setModal(null);
  }

  return (
    <div>
      <header className="view-head">
        <div><h1>Itens do estoque</h1><p className="subtitle">{items.length} item(ns) cadastrado(s)</p></div>
        <div className="head-actions">
          <button className="btn btn-ghost" onClick={() => setModal("import")}><IconUpload size={15} /> Importar CSV</button>
          <button className="btn btn-primary" onClick={openAdd}><IconPlus size={15} /> Novo item</button>
        </div>
      </header>
      <div className="toolbar">
        <div className="search-box"><IconSearch size={15} /><input placeholder="Buscar por código, nome ou local..." value={query} onChange={e => setQuery(e.target.value)} /></div>
        <select className="select" value={catFilter} onChange={e => setCatFilter(e.target.value)}>
          <option value="">Todas as categorias</option>
          {categorias.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      {items.length === 0 ? (
        <div className="empty-state"><IconPackage size={32} /><h3>Nenhum item cadastrado ainda</h3><p>Adicione seu primeiro item ou importe uma lista via CSV para começar.</p><button className="btn btn-primary" onClick={openAdd}><IconPlus size={15} /> Novo item</button></div>
      ) : (
        <div className="table-wrap">
          <table>
            <thead><tr><th>Código</th><th>Nome</th><th>Categoria</th><th>Local</th><th>Nível</th><th>Qtd.</th><th>Mín.</th><th></th></tr></thead>
            <tbody>
              {filtered.map(i => {
                const status = stockStatus(i);
                return (
                  <tr key={i.id}>
                    <td className="mono">{i.codigo}</td><td>{i.nome}</td>
                    <td className="muted-cell">{i.categoria || "—"}</td><td className="muted-cell">{i.localizacao || "—"}</td>
                    <td><Gauge item={i} /></td><td className="mono">{fmtNum(i.quantidade)} {i.unidade}</td>
                    <td className="mono muted-cell">{fmtNum(i.estoqueMinimo)}</td>
                    <td className="row-actions">
                      {status === "danger" && <Badge status="danger">baixo</Badge>}
                      <button className="icon-btn" onClick={() => openEdit(i)}><IconEdit size={14} /></button>
                      <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(i.id)}><IconTrash size={14} /></button>
                    </td>
                  </tr>
                );
              })}
              {filtered.length === 0 && <tr><td colSpan={8} className="empty-mini" style={{ padding: "24px" }}>Nenhum item corresponde à busca.</td></tr>}
            </tbody>
          </table>
        </div>
      )}
      {(modal === "add" || modal === "edit") && (
        <Modal title={modal === "add" ? "Novo item" : "Editar item"} onClose={() => setModal(null)}>
          <form onSubmit={submitForm} className="form-grid">
            <label>Código<input required value={form.codigo} onChange={e => setForm({ ...form, codigo: e.target.value })} placeholder="EX: PAR-0012" /></label>
            <label>Nome<input required value={form.nome} onChange={e => setForm({ ...form, nome: e.target.value })} placeholder="Parafuso sextavado M6" /></label>
            <label>Categoria<input value={form.categoria} onChange={e => setForm({ ...form, categoria: e.target.value })} placeholder="Fixadores" /></label>
            <label>Unidade<input value={form.unidade} onChange={e => setForm({ ...form, unidade: e.target.value })} placeholder="un, cx, kg..." /></label>
            <label>Quantidade atual<input type="number" step="any" value={form.quantidade} onChange={e => setForm({ ...form, quantidade: e.target.value })} /></label>
            <label>Estoque mínimo<input type="number" step="any" value={form.estoqueMinimo} onChange={e => setForm({ ...form, estoqueMinimo: e.target.value })} /></label>
            <label className="span-2">Localização<input value={form.localizacao} onChange={e => setForm({ ...form, localizacao: e.target.value })} placeholder="Prateleira A3" /></label>
            <div className="form-actions span-2"><button type="button" className="btn btn-ghost" onClick={() => setModal(null)}>Cancelar</button><button type="submit" className="btn btn-primary">Salvar item</button></div>
          </form>
        </Modal>
      )}
      {modal === "import" && (
        <Modal title="Importar itens via CSV" onClose={() => setModal(null)} wide>
          <p className="hint">Cole uma linha por item, valores separados por vírgula ou ponto e vírgula, na ordem:<br /><span className="mono">código, nome, categoria, unidade, quantidade, estoque mínimo, localização</span></p>
          <textarea className="import-area" rows={10} placeholder={"PAR-0012, Parafuso sextavado M6, Fixadores, un, 340, 100, Prateleira A3\nTUB-0045, Tubo PVC 25mm, Hidráulica, m, 12, 20, Prateleira B1"} value={importText} onChange={e => setImportText(e.target.value)} />
          <div className="form-actions"><button type="button" className="btn btn-ghost" onClick={() => setModal(null)}>Cancelar</button><button type="button" className="btn btn-primary" onClick={doImport}><IconUpload size={15} /> Importar</button></div>
        </Modal>
      )}
      {confirmDelete && (
        <Modal title="Excluir item" onClose={() => setConfirmDelete(null)}>
          <p>Tem certeza que deseja excluir este item? Essa ação não pode ser desfeita.</p>
          <div className="form-actions"><button className="btn btn-ghost" onClick={() => setConfirmDelete(null)}>Cancelar</button><button className="btn btn-danger" onClick={() => doDelete(confirmDelete)}><IconTrash size={15} /> Excluir</button></div>
        </Modal>
      )}
    </div>
  );
}

function MovimentacoesView({ items, movements, persistItems, persistMovements }) {
  const [itemId, setItemId] = useState("");
  const [tipo, setTipo] = useState("entrada");
  const [quantidade, setQuantidade] = useState("");
  const [responsavel, setResponsavel] = useState("");
  const [observacao, setObservacao] = useState("");
  const [warning, setWarning] = useState("");
  const recent = useMemo(() => [...movements].sort((a, b) => new Date(b.data) - new Date(a.data)).slice(0, 30), [movements]);

  async function submit(e) {
    e.preventDefault();
    setWarning("");
    const item = items.find(i => i.id === itemId);
    const qty = Number(quantidade);
    if (!item || !qty || qty <= 0) return;
    if (tipo === "saida" && qty > Number(item.quantidade)) setWarning(`Atenção: saldo atual é ${fmtNum(item.quantidade)} ${item.unidade}. A saída deixará o saldo negativo.`);
    const novaQtd = tipo === "entrada" ? Number(item.quantidade) + qty : Number(item.quantidade) - qty;
    await persistItems(items.map(i => i.id === item.id ? { ...i, quantidade: novaQtd } : i));
    const mov = { id: uid(), itemId: item.id, itemNome: item.nome, itemCodigo: item.codigo, tipo, quantidade: qty, responsavel: responsavel || "—", observacao, data: new Date().toISOString() };
    await persistMovements([mov, ...movements]);
    setItemId(""); setQuantidade(""); setResponsavel(""); setObservacao("");
  }

  return (
    <div>
      <header className="view-head"><div><h1>Movimentações</h1><p className="subtitle">Registrar entrada ou saída de itens do almoxarifado</p></div></header>
      {items.length === 0 ? (
        <div className="empty-state"><IconList size={32} /><h3>Cadastre itens primeiro</h3><p>Você precisa de ao menos um item cadastrado para registrar movimentações.</p></div>
      ) : (
        <>
          <section className="panel">
            <form onSubmit={submit} className="mov-form">
              <div className="mov-type">
                <button type="button" className={"type-btn type-entrada" + (tipo === "entrada" ? " active" : "")} onClick={() => setTipo("entrada")}><IconDown size={16} /> Entrada</button>
                <button type="button" className={"type-btn type-saida" + (tipo === "saida" ? " active" : "")} onClick={() => setTipo("saida")}><IconUp size={16} /> Saída</button>
              </div>
              <div className="form-grid">
                <label className="span-2">Item<ItemPicker items={items} value={itemId} onChange={setItemId} /></label>
                <label>Quantidade<input type="number" step="any" min="0" required value={quantidade} onChange={e => setQuantidade(e.target.value)} /></label>
                <label>Responsável<input value={responsavel} onChange={e => setResponsavel(e.target.value)} placeholder="Nome de quem retirou/entregou" /></label>
                <label className="span-2">Observação<input value={observacao} onChange={e => setObservacao(e.target.value)} placeholder="Opcional" /></label>
              </div>
              {warning && <div className="warning-box"><IconAlert size={14} /> {warning}</div>}
              <div className="form-actions"><button type="submit" className="btn btn-primary" disabled={!itemId}>Registrar movimentação</button></div>
            </form>
          </section>
          <section className="panel" style={{ marginTop: 20 }}>
            <div className="panel-head"><h2>Movimentações recentes</h2></div>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Data</th><th>Item</th><th>Tipo</th><th>Qtd.</th><th>Responsável</th><th>Obs.</th></tr></thead>
                <tbody>
                  {recent.map(m => (
                    <tr key={m.id}>
                      <td className="muted-cell">{fmtDate(m.data)}</td><td>{m.itemCodigo} — {m.itemNome}</td>
                      <td>{m.tipo === "entrada" ? <Badge status="success">entrada</Badge> : <Badge status="danger">saída</Badge>}</td>
                      <td className="mono">{fmtNum(m.quantidade)}</td><td className="muted-cell">{m.responsavel}</td><td className="muted-cell">{m.observacao || "—"}</td>
                    </tr>
                  ))}
                  {recent.length === 0 && <tr><td colSpan={6} className="empty-mini" style={{ padding: "24px" }}>Nenhuma movimentação ainda.</td></tr>}
                </tbody>
              </table>
            </div>
          </section>
        </>
      )}
    </div>
  );
}

function RelatoriosView({ items, movements }) {
  const [tipoFiltro, setTipoFiltro] = useState("");
  const [itemFiltro, setItemFiltro] = useState("");
  const [dataInicio, setDataInicio] = useState("");
  const [dataFim, setDataFim] = useState("");

  const filtered = useMemo(() => {
    return movements.filter(m => {
      if (tipoFiltro && m.tipo !== tipoFiltro) return false;
      if (itemFiltro && m.itemId !== itemFiltro) return false;
      const d = new Date(m.data);
      if (dataInicio && d < new Date(dataInicio)) return false;
      if (dataFim && d > new Date(dataFim + "T23:59:59")) return false;
      return true;
    }).sort((a, b) => new Date(b.data) - new Date(a.data));
  }, [movements, tipoFiltro, itemFiltro, dataInicio, dataFim]);

  const totalEntradas = filtered.filter(m => m.tipo === "entrada").reduce((s, m) => s + Number(m.quantidade), 0);
  const totalSaidas = filtered.filter(m => m.tipo === "saida").reduce((s, m) => s + Number(m.quantidade), 0);

  function exportCsv() {
    const header = "Data,Codigo,Item,Tipo,Quantidade,Responsavel,Observacao";
    const rows = filtered.map(m => [new Date(m.data).toLocaleString("pt-BR"), m.itemCodigo, m.itemNome, m.tipo, m.quantidade, m.responsavel, (m.observacao || "").replace(/,/g, ";")].join(","));
    const csv = [header, ...rows].join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "relatorio-movimentacoes.csv"; a.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div>
      <header className="view-head"><div><h1>Relatórios</h1><p className="subtitle">Histórico completo de movimentações</p></div>
        <div className="head-actions"><button className="btn btn-ghost" onClick={exportCsv}><IconDownload size={15} /> Exportar CSV</button></div>
      </header>
      <section className="panel">
        <div className="filters-grid">
          <label>Tipo<select className="select" value={tipoFiltro} onChange={e => setTipoFiltro(e.target.value)}><option value="">Todos</option><option value="entrada">Entrada</option><option value="saida">Saída</option></select></label>
          <label>Item<ItemPicker items={items} value={itemFiltro} onChange={setItemFiltro} placeholder="Todos os itens" /></label>
          <label>De<input type="date" value={dataInicio} onChange={e => setDataInicio(e.target.value)} /></label>
          <label>Até<input type="date" value={dataFim} onChange={e => setDataFim(e.target.value)} /></label>
        </div>
      </section>
      <div className="cards-grid" style={{ marginTop: 16, marginBottom: 16 }}>
        <div className="stat-card"><div className="stat-icon icon-success"><IconDown size={18} /></div><div><div className="stat-value">{fmtNum(totalEntradas)}</div><div className="stat-label">total de entradas</div></div></div>
        <div className="stat-card"><div className="stat-icon icon-danger"><IconUp size={18} /></div><div><div className="stat-value">{fmtNum(totalSaidas)}</div><div className="stat-label">total de saídas</div></div></div>
        <div className="stat-card"><div className="stat-icon icon-steel"><IconClipboard size={18} /></div><div><div className="stat-value">{fmtNum(filtered.length)}</div><div className="stat-label">registros no filtro</div></div></div>
      </div>
      <div className="table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Código</th><th>Item</th><th>Tipo</th><th>Qtd.</th><th>Responsável</th><th>Obs.</th></tr></thead>
          <tbody>
            {filtered.map(m => (
              <tr key={m.id}>
                <td className="muted-cell">{fmtDate(m.data)}</td><td className="mono">{m.itemCodigo}</td><td>{m.itemNome}</td>
                <td>{m.tipo === "entrada" ? <Badge status="success">entrada</Badge> : <Badge status="danger">saída</Badge>}</td>
                <td className="mono">{fmtNum(m.quantidade)}</td><td className="muted-cell">{m.responsavel}</td><td className="muted-cell">{m.observacao || "—"}</td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan={7} className="empty-mini" style={{ padding: "24px" }}>Nenhum registro para os filtros selecionados.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}
