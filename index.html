const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
.almox-app {
  --graphite:#1C2530; --graphite-light:#2A3644; --steel:#3B6E8F; --steel-light:#EAF1F5;
  --amber:#E8A33D; --amber-light:#FCF1DF; --danger:#C0503A; --danger-light:#FAEAE5;
  --success:#4C8C6B; --success-light:#E9F4EE; --bg:#F5F6F8; --white:#FFFFFF; --border:#E1E4E8;
  --text:#1C2530; --text-muted:#6B7785;
  display:flex; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:14px; line-height:1.5;
}
.almox-app *{box-sizing:border-box;}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;}
.sidebar{width:220px;flex-shrink:0;background:var(--graphite);color:#fff;display:flex;flex-direction:column;padding:20px 14px;gap:24px;}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--amber);color:var(--graphite);display:flex;align-items:center;justify-content:center;}
.brand-title{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:13px;letter-spacing:0.03em;line-height:1.25;}
.brand-sub{font-size:11px;color:#9CA9B8;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;border:none;background:transparent;color:#C7D0DA;font-size:13.5px;cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s;}
.nav-item:hover{background:var(--graphite-light);color:#fff;}
.nav-item.active{background:var(--graphite-light);color:#fff;box-shadow:inset 3px 0 0 var(--amber);}
.nav-count{margin-left:auto;font-size:11px;background:rgba(255,255,255,0.1);padding:1px 6px;border-radius:20px;}
.sidebar-alert{margin-top:auto;display:flex;align-items:center;gap:8px;background:rgba(232,163,61,0.15);border:1px solid rgba(232,163,61,0.35);color:var(--amber);padding:10px;border-radius:8px;font-size:12px;cursor:pointer;text-align:left;}
.main{flex:1;padding:28px 32px;min-width:0;overflow-x:auto;}
.error-banner{background:var(--danger-light);color:var(--danger);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;}
.loading-screen{display:flex;align-items:center;gap:10px;color:var(--text-muted);padding:60px 0;justify-content:center;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:12px;flex-wrap:wrap;}
.view-head h1{font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:700;margin:0;}
.subtitle{color:var(--text-muted);margin:4px 0 0;font-size:13px;}
.head-actions{display:flex;gap:8px;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;}
.stat-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-steel{background:var(--steel-light);color:var(--steel);}
.icon-success{background:var(--success-light);color:var(--success);}
.icon-danger{background:var(--danger-light);color:var(--danger);}
.stat-value{font-family:"Space Grotesk",sans-serif;font-size:20px;font-weight:700;}
.stat-label{font-size:12px;color:var(--text-muted);}
.split-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;}
.panel{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.panel-head h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;margin:0;}
.link-btn{background:none;border:none;color:var(--steel);font-size:12.5px;cursor:pointer;}
.mini-list{display:flex;flex-direction:column;gap:10px;}
.mini-row{display:flex;align-items:center;gap:10px;font-size:13px;}
.mini-info{display:flex;flex-direction:column;flex:1;min-width:0;}
.mini-code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-muted);}
.mini-sub{font-size:11px;color:var(--text-muted);}
.mini-qty{font-family:"IBM Plex Mono",monospace;font-size:12.5px;white-space:nowrap;}
.empty-mini{color:var(--text-muted);font-size:13px;text-align:center;padding:12px 0;}
.txt-success{color:var(--success);} .txt-danger{color:var(--danger);}
.gauge{width:70px;flex-shrink:0;}
.gauge-track{position:relative;height:6px;background:#EEF0F2;border-radius:4px;overflow:visible;}
.gauge-fill{height:100%;border-radius:4px;transition:width .2s;}
.gauge-success{background:var(--success);} .gauge-amber{background:var(--amber);} .gauge-danger{background:var(--danger);}
.gauge-min{position:absolute;top:-2px;width:2px;height:10px;background:var(--graphite);opacity:0.4;}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:260px;flex:1;color:var(--text-muted);}
.search-box input{border:none;outline:none;flex:1;font-size:13.5px;color:var(--text);background:transparent;}
.select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--white);font-size:13.5px;color:var(--text);}
.filters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end;}
.filters-grid label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text-muted);}
.filters-grid input{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13.5px;}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:9px 14px;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:filter .15s,background .15s;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-primary{background:var(--steel);color:#fff;}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);}
.btn-ghost{background:var(--white);border-color:var(--border);color:var(--text);}
.btn-ghost:hover{background:#F0F2F4;}
.btn-danger{background:var(--danger);color:#fff;}
.icon-btn{background:none;border:none;padding:5px;border-radius:6px;cursor:pointer;color:var(--text-muted);display:inline-flex;}
.icon-btn:hover{background:#F0F2F4;color:var(--text);}
.icon-btn-danger:hover{background:var(--danger-light);color:var(--danger);}
.table-wrap{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:10px 14px;border-bottom:1px solid #F0F1F3;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFC;}
.muted-cell{color:var(--text-muted);}
.row-actions{display:flex;align-items:center;gap:6px;justify-content:flex-end;}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
.badge-danger{background:var(--danger-light);color:var(--danger);}
.badge-success{background:var(--success-light);color:var(--success);}
.badge-amber{background:var(--amber-light);color:#9C6C1F;}
.empty-state{background:var(--white);border:1px dashed var(--border);border-radius:12px;padding:48px 24px;text-align:center;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:8px;}
.empty-state h3{color:var(--text);font-size:15px;margin:4px 0 0;}
.empty-state p{max-width:320px;margin:0 0 8px;font-size:13px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(28,37,48,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:#fff;border-radius:12px;width:420px;max-width:100%;max-height:88vh;overflow-y:auto;}
.modal-wide{width:560px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:15px;font-weight:600;}
.modal-body{padding:18px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-muted);}
.form-grid input{border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13.5px;color:var(--text);}
.span-2{grid-column:span 2;}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
.hint{font-size:12.5px;color:var(--text-muted);margin:0 0 10px;line-height:1.6;}
.import-area{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;resize:vertical;margin-bottom:12px;}
.mov-form{display:flex;flex-direction:column;gap:14px;}
.mov-type{display:flex;gap:8px;}
.type-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--white);color:var(--text-muted);cursor:pointer;font-size:13.5px;font-weight:500;}
.type-entrada.active{background:var(--success-light);border-color:var(--success);color:var(--success);}
.type-saida.active{background:var(--danger-light);border-color:var(--danger);color:var(--danger);}
.warning-box{display:flex;align-items:center;gap:8px;background:var(--amber-light);color:#9C6C1F;padding:9px 12px;border-radius:8px;font-size:12.5px;}
.picker{position:relative;}
.picker-input{width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--white);font-size:13.5px;cursor:pointer;color:var(--text);}
.muted{color:var(--text-muted);}
.picker-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(28,37,48,0.12);z-index:40;max-height:280px;display:flex;flex-direction:column;}
.picker-search{display:flex;align-items:center;gap:7px;padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text-muted);}
.picker-search input{border:none;outline:none;flex:1;font-size:13px;}
.picker-list{overflow-y:auto;}
.picker-item{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border:none;background:none;text-align:left;cursor:pointer;font-size:12.5px;}
.picker-item:hover{background:#F5F6F8;}
.picker-code{font-family:"IBM Plex Mono",monospace;color:var(--text-muted);flex-shrink:0;}
.picker-qty{margin-left:auto;color:var(--text-muted);font-family:"IBM Plex Mono",monospace;flex-shrink:0;}
.picker-empty{padding:14px;text-align:center;color:var(--text-muted);font-size:12.5px;}
.config-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:20px;}
.config-card{max-width:420px;background:#fff;border:1px solid #E1E4E8;border-radius:12px;padding:28px;text-align:center;color:#1C2530;}
.config-card svg{color:#E8A33D;margin-bottom:10px;}
.config-card code{background:#F0F2F4;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12.5px;}
@media (max-width:760px){
  .almox-app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;align-items:center;padding:12px 16px;gap:16px;}
  .brand-sub{display:none;}
  .nav{flex-direction:row;overflow-x:auto;}
  .sidebar-alert{display:none;}
  .main{padding:18px;}
  .split-grid{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .span-2{grid-column:span 1;}
}
`;
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));

</script>
</body>
</html>
